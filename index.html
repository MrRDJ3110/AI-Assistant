<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg:#04060f; --cyan:#00e5ff; --mag:#ff2bd6; --green:#39ff9c; --amber:#ffc857; --text:#cfe9ff; --muted:#7a93b3; --line:rgba(0,229,255,.28); }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:radial-gradient(ellipse at 50% -10%, #12285a 0%, #070b1c 48%, var(--bg) 100%); color:var(--text);
         font-family:"Share Tech Mono",Consolas,"Courier New",monospace; display:flex; justify-content:center; overflow:hidden; }
  /* stars */
  body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.55; animation:drift 140s linear infinite;
    background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent), radial-gradient(1px 1px at 120px 80px,#9ff,transparent),
                     radial-gradient(1.5px 1.5px at 200px 150px,#fff,transparent), radial-gradient(1px 1px at 60px 170px,#fff,transparent),
                     radial-gradient(1px 1px at 170px 20px,#f9f,transparent);
    background-size:240px 200px; }
  /* scanlines */
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
  /* moving floor grid */
  .grid { position:fixed; left:-50%; right:-50%; bottom:0; height:55%; pointer-events:none; opacity:.35;
    background-image:linear-gradient(var(--line) 1px,transparent 1px), linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:56px 56px; transform:perspective(420px) rotateX(62deg); transform-origin:50% 100%;
    -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%); mask-image:linear-gradient(to top,#000 10%,transparent 85%);
    animation:floor 3s linear infinite; }

  .app { position:relative; z-index:2; width:100%; max-width:780px; height:100%; display:flex; flex-direction:column; padding:14px 16px 12px; }
  header { text-align:center; }
  .orb { --c:var(--cyan); width:70px; height:70px; margin:28px auto 18px; border-radius:50%; position:relative;
    background:radial-gradient(circle, #eaffff 0 7%, var(--c) 16%, transparent 66%);
    box-shadow:0 0 30px var(--c), inset 0 0 16px var(--c); animation:pulse 3s ease-in-out infinite; transition:box-shadow .3s; }
  .orb::before,.orb::after { content:""; position:absolute; border-radius:50%; }
  .orb::before { inset:-10px; border:1px dashed var(--c); opacity:.7; animation:spin 14s linear infinite; }
  .orb::after { inset:-19px; border:2px solid transparent; border-top-color:var(--c); border-bottom-color:var(--c); opacity:.8; animation:spin 6s linear infinite reverse; }
  .orb.listening { --c:var(--mag); animation-duration:.9s; }
  .orb.speaking { --c:var(--green); animation-duration:1.1s; }
  h1 { font-family:"Orbitron","Segoe UI",sans-serif; font-weight:800; font-size:1.55rem; letter-spacing:.28em; margin:6px 0 4px;
       color:#eaffff; text-shadow:0 0 8px var(--cyan), 0 0 22px rgba(0,229,255,.55); }
  .tag { margin:0 0 12px; font-size:.78rem; letter-spacing:.2em; color:var(--muted); }
  .tag::after { content:"_"; animation:blink 1s steps(1) infinite; color:var(--cyan); }

  .panel { position:relative; flex:1; min-height:0; display:flex; }
  .panel::before,.panel::after { content:""; position:absolute; width:22px; height:22px; border:2px solid var(--cyan); z-index:1; pointer-events:none;
    filter:drop-shadow(0 0 5px var(--cyan)); }
  .panel::before { top:-5px; left:-5px; border-right:0; border-bottom:0; }
  .panel::after { bottom:-5px; right:-5px; border-left:0; border-top:0; }
  #chat { flex:1; overflow-y:auto; padding:16px 18px; background:rgba(5,12,32,.72); backdrop-filter:blur(6px);
    border:1px solid var(--line); box-shadow:0 0 34px rgba(0,229,255,.12), inset 0 0 40px rgba(0,229,255,.05); scrollbar-color:var(--cyan) transparent; }
  .msg { margin:0 0 12px; padding-left:12px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; border-left:2px solid currentColor; animation:msgIn .35s ease-out; }
  .user { color:var(--cyan); }
  .assistant { color:var(--green); text-shadow:0 0 6px rgba(57,255,156,.35); }
  .system { color:var(--amber); }
  .msg a { color:var(--amber); }

  form { display:flex; gap:10px; margin-top:16px; }
  input { flex:1; min-width:0; padding:13px 14px; font:inherit; font-size:1rem; color:var(--text); background:rgba(5,12,32,.85);
    border:1px solid var(--line); outline:none; transition:border-color .2s, box-shadow .2s; }
  input::placeholder { color:var(--muted); }
  input:focus { border-color:var(--cyan); box-shadow:0 0 14px rgba(0,229,255,.45); }
  input:focus-visible { outline:none; }
  button { padding:0 22px; font:inherit; font-size:.95rem; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; border:1px solid var(--cyan);
    color:#021018; background:linear-gradient(135deg, var(--cyan), #6af0ff); box-shadow:0 0 14px rgba(0,229,255,.45);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); transition:filter .2s, transform .1s; }
  button:hover { filter:brightness(1.15) drop-shadow(0 0 8px var(--cyan)); }
  button:active { transform:translateY(1px); }
  button#mic { color:var(--mag); background:rgba(255,43,214,.08); border-color:var(--mag); box-shadow:0 0 12px rgba(255,43,214,.35); }
  button#mic.on { color:#1a0016; background:var(--mag); animation:pulse 1s ease-in-out infinite; }
  button:disabled { opacity:.35; cursor:not-allowed; filter:none; }
  :focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  #status { text-align:center; font-size:.76rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:12px 0 0; }
  #status::before { content:"\25CF"; margin-right:8px; color:var(--green); text-shadow:0 0 8px var(--green); animation:blink 2s ease-in-out infinite; }

  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 50% { transform:scale(1.06); filter:brightness(1.25); } }
  @keyframes blink { 50% { opacity:.2; } }
  @keyframes drift { to { background-position:-480px 400px; } }
  @keyframes floor { to { background-position:0 56px; } }
  @keyframes msgIn { from { opacity:0; transform:translateY(6px); } }
  @media (max-width:600px) { h1 { font-size:1.1rem; letter-spacing:.14em; } button { padding:0 14px; } }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<div class="app">
  <header>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <h1>Personal AI Assistant</h1>
    <p class="tag">NEURAL LINK ONLINE</p>
  </header>
  <div class="panel">
    <div id="chat" role="log" aria-live="polite"></div>
  </div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Type a command, e.g. what is python" aria-label="Command">
    <button type="submit">Send</button>
    <button type="button" id="mic">Mic</button>
  </form>
  <p id="status"></p>
</div>
<script>
const USER_NAME = "User";
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const micBtn = document.getElementById("mic");
const statusEl = document.getElementById("status");
const orb = document.getElementById("orb");

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canSpeak = "speechSynthesis" in window;
if (!SR) micBtn.disabled = true;
statusEl.textContent = SR && canSpeak ? "Voice and text available"
  : canSpeak ? "Voice output only (mic not supported in this browser)"
  : "Text-only mode";

function log(text, cls, prefix = "") {
  const p = document.createElement("p");
  p.className = "msg " + cls;
  p.textContent = prefix + text;
  chat.appendChild(p);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.onstart = () => orb.classList.add("speaking");
  u.onend = u.onerror = () => orb.classList.remove("speaking");
  speechSynthesis.speak(u);
}

const has = (t, ...words) => words.some(w => new RegExp("\\b" + w + "\\b").test(t));

const JOKES = [
  "Why do programmers prefer dark mode? Because light attracts bugs.",
  "I would tell you a UDP joke, but you might not get it.",
  "There are 10 types of people: those who understand binary and those who don't.",
  "A SQL query walks into a bar, sees two tables and asks: can I join you?",
  "Why did the developer go broke? He used up all his cache."
];

async function wiki(topic) {
  try {
    const s = await fetch("https://en.wikipedia.org/w/api.php?action=opensearch&limit=1&namespace=0&format=json&origin=*&search=" + encodeURIComponent(topic));
    const titles = (await s.json())[1];
    if (!titles || !titles.length) return null;
    const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(titles[0].replace(/ /g, "_")));
    const extract = ((await r.json()).extract || "").trim();
    if (!extract) return null;
    return extract.split(". ").slice(0, 2).join(". ").replace(/\.$/, "") + ".";
  } catch (e) { return null; }
}

function openTab(url, msg) { window.open(url, "_blank", "noopener"); return msg; }

// Installed apps that register a link the browser can launch (asks permission first)
const APPS = {
  "steam": "steam://open/main",
  "epic games": "com.epicgames.launcher://apps", "epic games launcher": "com.epicgames.launcher://apps",
  "epic": "com.epicgames.launcher://apps", "epicgames": "com.epicgames.launcher://apps",
  "spotify": "spotify:", "discord": "discord://", "telegram": "tg://",
  "calculator": "calculator:", "settings": "ms-settings:", "teams": "msteams:",
  "vscode": "vscode://", "vs code": "vscode://", "visual studio code": "vscode://",
  "zoom": "zoommtg://", "slack": "slack://", "skype": "skype:",
  "paint": "ms-paint:", "photos": "ms-photos:", "clock": "ms-clock:", "camera": "microsoft.windows.camera:",
  "store": "ms-windows-store:", "xbox": "xbox:", "snipping tool": "ms-screenclip:", "screenshot": "ms-screenclip:",
  "onenote": "onenote:", "notion": "notion://", "obsidian": "obsidian://", "figma": "figma://", "minecraft": "minecraft:"
};

function logLink(label, url) {
  const p = document.createElement("p");
  p.className = "msg system";
  const a = document.createElement("a");
  a.href = url; a.textContent = label; a.style.color = "var(--sys)";
  p.appendChild(a);
  chat.appendChild(p);
  chat.scrollTop = chat.scrollHeight;
}

// ---- Phones: detect the device and use app links that phones understand ----
const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(UA);
const IS_MOBILE = IS_IOS || IS_ANDROID;

const MOBILE_APPS = Object.assign({
  "whatsapp": "whatsapp://", "facebook": "fb://", "messenger": "fb-messenger://", "twitter": "twitter://",
  "telegram": "tg://", "snapchat": "snapchat://", "spotify": "spotify:", "discord": "discord://",
  "linkedin": "linkedin://", "reddit": "reddit://", "pinterest": "pinterest://", "netflix": "nflx://",
  "zoom": "zoomus://", "skype": "skype:", "slack": "slack://", "uber": "uber://",
  "dialer": "tel:", "call": "tel:", "messages": "sms:", "sms": "sms:", "mail": "mailto:", "email": "mailto:"
}, IS_IOS ? {
  "instagram": "instagram://app", "youtube": "youtube://", "facetime": "facetime:", "calendar": "calshow://",
  "music": "music://", "photos": "photos-redirect://", "app store": "itms-apps://", "shortcuts": "shortcuts://",
  "notes": "mobilenotes://", "maps": "maps://", "google maps": "comgooglemaps://", "gmail": "googlegmail://",
  "mail": "message://", "email": "message://", "chrome": "googlechromes://"
} : {
  "instagram": "instagram://", "youtube": "vnd.youtube://", "play store": "https://play.google.com/store",
  "maps": "geo:0,0?q=", "google maps": "geo:0,0?q="
});

// Android Chrome shows an error page for unknown links, so wrap them as intents
// (if the app isn't installed, nothing happens and the assistant stays open).
function launchUrl(url) {
  if (!IS_ANDROID) return url;
  const m = url.match(/^([a-z][a-z0-9+.\-]*):(?:\/\/)?(.*)$/i);
  if (!m || /^(https?|tel|sms|mailto|geo)$/i.test(m[1])) return url;
  return "intent://" + m[2] + "#Intent;scheme=" + m[1] + ";end";
}

// If "python app.py" is running on this PC, ask it to open the app (works for any installed app)
const PC_NAMES = { "vs code": "visual studio code", "vscode": "visual studio code" };

async function pcOpen(name) {
  try {
    const r = await fetch("http://127.0.0.1:5000/api/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command: "open " + (PC_NAMES[name] || name) }),
      signal: AbortSignal.timeout(2000)
    });
    return (await r.json()).reply;
  } catch (e) { return null; }
}

async function openApp(name) {
  const n = name.replace(/^(my|the)\s+/, "").replace(/\s+(app|application|please|now)$/, "").trim();
  const apps = IS_MOBILE ? MOBILE_APPS : APPS;
  if (!IS_MOBILE) {
    const pc = await pcOpen(n);
    if (pc && !pc.startsWith("I couldn't find")) return pc;
  }
  let url = apps[n];
  if (!url) {
    // forgiving match: longest known name contained in what was said ("epic game launcher" -> "epic")
    const key = Object.keys(apps).filter(k => n.includes(k)).sort((a, b) => b.length - a.length)[0];
    if (key) url = apps[key];
  }
  if (!url) {
    return IS_MOBILE
      ? "I can't open '" + n + "' from a browser. Apps I can open on this phone: " + Object.keys(apps).join(", ") + "."
      : "I can't open '" + n + "' from a website alone. Run 'python app.py' on this PC to open any app. Without it I can open: " + Object.keys(apps).join(", ") + ", youtube, google, instagram, whatsapp.";
  }
  const link = launchUrl(url);
  window.location.href = link;
  setTimeout(() => logLink("Didn't open? Tap here to launch " + n, link), 0);
  return "Opening " + n + ". Allow the prompt if one appears.";
}

// Returns a string, or a Promise of a string
function process(raw) {
  const original = raw.trim();
  const c = original.toLowerCase().replace(/[.!?,\s]+$/, "");
  if (!c) return "I didn't catch that. Could you repeat it?";

  if (has(c, "hi", "hey", "hello")) {
    const h = new Date().getHours();
    const part = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
    return `${part}, ${USER_NAME}! How can I help you?`;
  }
  if (has(c, "help") || c.includes("what can you do"))
    return "I can tell the time or date; open Google, YouTube, Instagram or WhatsApp; search the web; answer 'who/what/where is ...' questions from Wikipedia; tell a joke; save a note with 'note: ...'; repeat something with 'say ...'.";
  if (has(c, "time")) return "The current time is " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) + ".";
  if (has(c, "date", "today")) return "Today is " + new Date().toLocaleDateString("en-GB", {weekday:"long", day:"2-digit", month:"long", year:"numeric"}) + ".";

  if (IS_MOBILE && c.startsWith("open ") && !c.includes("open google")) return openApp(c.slice(5).trim());
  if (c.includes("open youtube")) return openTab("https://youtube.com", "Opening YouTube.");
  if (c.includes("open whatsapp")) return openTab("https://web.whatsapp.com/", "Opening WhatsApp.");
  if (c.includes("open google")) return openTab("https://google.com", "Opening Google.");
  if (c.includes("open instagram")) return openTab("https://www.instagram.com", "Opening Instagram.");
  if (c.startsWith("open ")) return openApp(c.slice(5).trim());

  if (c.startsWith("search")) {
    const q = c.replace("search for", "").replace("search", "").trim();
    if (!q) return "What should I search for?";
    return openTab("https://www.google.com/search?q=" + encodeURIComponent(q), "Here's what I found for " + q + ".");
  }

  const prefixes = ["who is","who was","what is","what was","who created","who made","who invented","who founded","who discovered","where is","where was","where are"];
  const p = prefixes.find(x => c.startsWith(x));
  if (p) {
    const topic = c.slice(p.length).trim();
    if (!topic) return "Who or what would you like to know about?";
    return wiki(topic).then(r => r || "I couldn't find clear information on " + topic + ".");
  }

  if (has(c, "joke", "jokes")) return JOKES[Math.floor(Math.random() * JOKES.length)];
  if (c.startsWith("speak ") || c.startsWith("say ")) return original.split(" ").slice(1).join(" ") || "What would you like me to say?";

  if (c.startsWith("note:") || c.startsWith("take a note")) {
    const content = c.startsWith("note:") ? c.split(":").slice(1).join(":").trim()
                                          : c.slice("take a note".length).replace(/^:/, "").trim();
    if (!content) return "What should I write in the note?";
    try {
      const notes = JSON.parse(localStorage.getItem("notes") || "[]");
      notes.push("[" + new Date().toLocaleString() + "] " + content);
      localStorage.setItem("notes", JSON.stringify(notes));
      return "Noted!";
    } catch (e) { return "I couldn't save the note in this browser."; }
  }
  if (has(c, "notes") && (c.startsWith("show") || c.startsWith("read"))) {
    const notes = JSON.parse(localStorage.getItem("notes") || "[]");
    return notes.length ? notes.join("\n") : "You have no notes yet.";
  }

  if (c.includes("your name")) return "I'm your personal assistant, built in Python. My creator is Rushi Jadhav.";
  if (has(c, "thank", "thanks")) return "You're welcome!";
  if (has(c, "exit", "quit", "bye", "stop")) return "Goodbye! Refresh the page to start again.";
  return "I'm not sure how to help with that yet.";
}

async function respond(text) {
  log(text, "user", "You: ");
  const reply = await process(text);
  log(reply, "assistant", "Assistant: ");
  speak(reply);
}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = input.value.trim();
  if (!v) return;
  input.value = "";
  respond(v);
});

if (SR) {
  const rec = new SR();
  rec.lang = "en-US";
  rec.onstart = () => { orb.classList.add("listening"); micBtn.classList.add("on"); statusEl.textContent = "Listening..."; };
  rec.onend = () => { orb.classList.remove("listening"); micBtn.classList.remove("on"); statusEl.textContent = "Voice and text available"; };
  rec.onresult = e => respond(e.results[0][0].transcript);
  rec.onerror = e => log(e.error === "not-allowed" ? "Microphone permission was blocked." : "I didn't catch that.", "system");
  micBtn.addEventListener("click", () => { try { rec.start(); } catch (e) {} });
}

log("System online. Type a command below or tap Mic.", "system");
</script>
</body>
</html>
